<main class="page">
  <header class="header">
    <p class="eyebrow">Operations console</p>
    <h1>Dispatch Board</h1>
    <p class="subtitle">Most urgent first, then oldest. All incidents and addresses are fictional.</p>

  <app-status-summary [incidents]="list.incidents()" />

  </div>
</main>
